; 현관 도어 트리거 테스트 — ESP32(WROOM 클래식)용 BLE 마우스 (NimBLE)
; 목적: 폰이 멀어졌다가 현관으로 다가올 때 "재연결까지 걸리는 시간" 측정
; NimBLE로 본딩(페어링 기억)을 NVS에 저장 -> 재연결이 제대로 동작
[env:esp32dev]
; arduino-esp32 2.0.x 계열 (NimBLE-Arduino 1.4.x와 호환)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
