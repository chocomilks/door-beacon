# 현관 도어마우스 — 도착 시 문 열기 (초안, 내일 적용 전 검토용)
# 전제: 펌웨어가 MQTT 디스커버리로 아래 엔티티를 자동 생성함
#   - binary_sensor.doormouse_presence  (연결=on, 속성 away_s / rssi)
#   - sensor.doormouse_rssi             (연결 링크 RSSI, dBm)
#
# ⚠ RSSI 문턱값(-60)은 '문 앞' 기준의 임시값. 내일 캘리브레이션으로 확정한다.
#    (폰을 문앞/복도/집안에 두고 sensor.doormouse_rssi 값을 보고 정함)
#    더 가까울수록 값이 큼(덜 음수): 문앞 -45, 멀리 -80 같은 식.
#
# 튀는 값 방어(2겹):
#   1) 펌웨어: sensor.doormouse_rssi 는 이미 EMA 평활값(스파이크 억제). 생값은 속성 rssi_raw.
#   2) 자동화: 문턱값을 'for: 2초' 유지했을 때만 인정 → 스치는 스파이크/채터 제거.
#   (문 열기는 1회성이라 평활+유지로 충분. 지속 상태가 필요하면 enter/exit 이중 문턱으로 확장 가능)

alias: 현관 도어마우스 — 도착 시 문 열기
description: >
  폰이 60초 넘게 떨어져 있다가(진짜 외출 후) 다시 연결되고,
  RSSI가 '문 앞' 수준으로 가까워지면 세대현관문을 연다.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: binary_sensor.doormouse_presence
    from: "off"
    to: "on"
    id: arrived

conditions:
  # 진짜 귀가만: 집 안에서의 짧은 깜빡임(수초) 재연결은 제외
  - condition: template
    value_template: "{{ state_attr('binary_sensor.doormouse_presence','away_s') | int(-1) > 60 }}"
  # 시간대 제한
  - condition: time
    after: "07:00:00"
    before: "23:59:00"
  # 이미 문이 열려 있으면 하지 않음
  - condition: state
    entity_id: binary_sensor.entrance_espresense_entrance_sedaehyeongwanmun_yeolrimsenseo
    state: "off"

actions:
  - alias: 문앞 수준 RSSI가 2초 이상 유지될 때까지 대기(최대 30초) — 스파이크/채터 방지
    wait_for_trigger:
      - trigger: numeric_state
        entity_id: sensor.doormouse_rssi
        above: -60
        for:
          seconds: 2
    timeout:
      seconds: 30
    continue_on_timeout: true

  - alias: 2초 유지가 안 됐으면(시간초과) 취소 — 지금도 문앞 수준이어야
    condition: numeric_state
    entity_id: sensor.doormouse_rssi
    above: -60

  - alias: 대기 중 문이 이미 열렸으면 취소
    condition: state
    entity_id: binary_sensor.entrance_espresense_entrance_sedaehyeongwanmun_yeolrimsenseo
    state: "off"

  - alias: 세대현관문 열기
    action: script.turn_on
    target:
      entity_id: script.hyeongwanmun_yeolgi

# (선택) 이중 확인을 원하면 conditions에 아래를 추가:
#   - condition: state
#     entity_id: device_tracker.iptime_seungwon   # 와이프 WiFi 트래커(확인 필요)
#     state: not_home
#   단, consider_home을 늘려두면 '방금 외출'이 늦게 풀려 방해될 수 있어 주의.
